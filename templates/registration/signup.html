{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Create Account | HealthRisk AI</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p>Create your HealthRisk AI account.</p>

        <form method="post" novalidate>

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    {{ field.label_tag }}

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="error">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

</body>

</html>
