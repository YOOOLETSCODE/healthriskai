{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>HealthRisk AI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="stylesheet" href="{% static 'css/history.css' %}">
    <link rel="stylesheet" href="{% static 'css/assessment.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/ai_assistant.css' %}"> 
</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 bg-dark text-white min-vh-100 p-3">

<h3 class="text-center mb-4">

HealthRisk AI

</h3>

<hr>

<a href="/dashboard/"
class="text-white text-decoration-none d-block mb-3">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

<a href="/patients/new/"
class="text-white text-decoration-none d-block mb-3">

<i class="bi bi-heart-pulse"></i>

New Assessment

</a>

<a href="/patients/history/"
class="text-white text-decoration-none d-block mb-3">

<i class="bi bi-clock-history"></i>

History

</a>

<a href="{% url 'dashboard:ai_assistant' %}"
class="text-white text-decoration-none d-block mb-3">

<i class="bi bi-robot"></i>

AI Assistant

</a>

<a href="/accounts/profile/"
class="text-white text-decoration-none d-block mb-3">

<i class="bi bi-person-circle"></i>

Profile

</a>

<a href="/accounts/logout/"
class="text-warning text-decoration-none d-block">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</div>

<!-- Main Content -->

<div class="col-md-10 p-4">

{% block content %}

{% endblock %}

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
