{% extends "base.html" %}

{% block content %}

<h2>Delete Assessment</h2>

<p>

Are you sure you want to delete this assessment?

</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit" class="delete-btn">

        Delete

    </button>

    <a href="/patients/history/{{ record.id }}/">

        Cancel

    </a>

</form>

{% endblock %}
